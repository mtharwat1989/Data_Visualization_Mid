<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استعراض البيانات ISY 358 | المنصة الذهبية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#D4AF37;--gl:#F5D67B;--bg:#000;--c:#0c0c0c;--c2:#161410;--t:#f4efe2;--m:#a99f86;--ok:#3ddc84;--no:#ff5c5c;--cy:#6fd3ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;font-family:Cairo,Tahoma,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);line-height:1.9;font-size:17px}
.w{max-width:900px;margin:auto;padding:16px}
h1{font-size:clamp(28px,6vw,46px);margin:.2em 0;font-weight:900;background:linear-gradient(120deg,#fff3b8,var(--g),#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--c);border:1px solid #3a3010;border-radius:20px;padding:20px;margin:16px 0}
.gold{border-color:var(--g);box-shadow:0 0 0 1px #5a4a10 inset,0 10px 40px #d4af3715}

.k{color:var(--gl);font-weight:900}.g{color:var(--ok);font-weight:700}.r{color:var(--no);font-weight:700}.c{color:var(--cy);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.parts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}

svg{max-width:100%;height:auto}

.o.ok{border-color:var(--ok);background:#0f2a1a}.o.no{border-color:var(--no);background:#2a1010}
.q{direction:ltr;text-align:left;font-size:20px;font-weight:700;background:#111;border:1px solid #2a2410;border-radius:14px;padding:14px 16px}
.ex{background:#14110a;border:1px solid var(--g);border-radius:14px;padding:6px 16px;margin-top:12px}
.ex p{margin:.6em 0}
.bar{height:8px;background:#222;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--gl));transition:width .3s}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pb{width:38px;height:38px;border-radius:10px;border:1px solid #4a3d10;background:#111;color:var(--t);font-weight:700;cursor:pointer}
.pb.ok{background:#134d2a}.pb.no{background:#5a1a1a}.pb.cur{outline:2px solid var(--g)}
input[type=range]{width:100%;accent-color:var(--g)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== تخطيط الموقع المعجزة: السؤال + خريطة الأسئلة في الجنب ===== */
.w.wide{max-width:1120px}
.qgrid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);align-items:start}
.side{display:flex;flex-direction:column;gap:16px}
.side .card{margin:0}
@media(min-width:1024px){
.qgrid{grid-template-columns:minmax(0,1fr) 290px}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
}
.qbox{margin:0;padding:0;overflow:hidden}
.qhead{padding:14px 16px;background:#00000066;border-bottom:1px solid #d4af3733}
.qhead .pills{margin:0}
.cnt{background:linear-gradient(135deg,var(--gl),var(--g),#a67c00);color:#1a1400;border-radius:12px;padding:6px 16px;font-weight:900;font-size:15px}
.tyb{background:#a855f733;border:1px solid #c084fc66;color:#e9d5ff;border-radius:12px;padding:6px 14px;font-weight:700;font-size:15px}
.qbox .bar{border-radius:0;height:8px}
.qbody{padding:20px}

.opts{display:grid;gap:10px;margin-top:16px}
.o{display:flex;gap:12px;align-items:flex-start;margin:0;border-radius:16px;transition:.25s}
.o:hover:not(:disabled){transform:translateY(-2px)}
.o:disabled{color:var(--t);cursor:default}
.o.dim{opacity:.5}
.ol{flex-shrink:0;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;background:linear-gradient(135deg,var(--g),#8c6a00);color:#1a1400}
.ot{flex:1;padding-top:3px;line-height:1.7}
.q,.q *,.o,.o *{font-family:Poppins,Cairo,sans-serif}
.q{line-height:1.8}
.nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:24px}
.nav .gp{display:flex;gap:8px;flex-wrap:wrap}
.fin{background:linear-gradient(270deg,#ef4444,#f97316);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:900;font-size:15px;cursor:pointer}
/* خريطة الأسئلة */
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.pal .pb{width:100%;height:42px;border-radius:12px;transition:.2s}
.pal .pb:hover{transform:scale(1.08);border-color:var(--g)}
.pb.ok{background:linear-gradient(135deg,#16a34a,#15803d);border-color:#22c55e}
.pb.no{background:linear-gradient(135deg,#dc2626,#991b1b);border-color:#ef4444}
.pb.cur{outline:none;border:2px solid var(--gl);box-shadow:0 0 16px #d4af37b3;transform:scale(1.1)}
.lg{margin-top:12px;font-size:12.5px;line-height:1.9;color:var(--m)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.stats div{background:#00000066;border-radius:12px;padding:8px 4px}
.stats b{display:block;font-size:18px;line-height:1.5}
.stats span{font-size:12px;font-weight:700}
.tip{font-size:12.5px;line-height:1.9;color:var(--m)}
.rv{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.rv .pb{width:40px}
/* ترجمة الكلمة عند الوقوف عليها (نفس طريقة الموقع المعجزة) */
.wd{cursor:help;border-radius:6px;transition:background .2s}
.wd:hover{background:#d4af3730}
.wd.tr{color:var(--gl);font-weight:900;background:#d4af3733;padding:0 4px;direction:rtl;unicode-bidi:isolate;font-family:Cairo,sans-serif}
.wd.nt{background:#ff5c5c55}
/* ===== شاشة التحميل ===== */
#preloader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;background:#070B24;transition:opacity .7s}
#preloader .crown{width:112px;height:112px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:60px;background:linear-gradient(135deg,#F8E28A 0%,#D4AF37 45%,#A67C00 100%);animation:glowP 2s infinite}
@keyframes glowP{0%,100%{box-shadow:0 0 25px rgba(212,175,55,.45)}50%{box-shadow:0 0 55px rgba(212,175,55,.85)}}
#preloader h1{margin:24px 0 0;font-size:clamp(28px,6vw,40px);font-weight:900;background:linear-gradient(135deg,#FFF6C8 0%,#F5D67B 25%,#D4AF37 55%,#F5D67B 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#preloader p{margin:8px 0 0;font-size:clamp(16px,3.5vw,20px);color:rgba(255,255,255,.6)}
#preloader .lb{width:256px;max-width:80%;height:8px;margin-top:24px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
#preloader .lb i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#8C6A00,#D4AF37,#FFF6C8,#D4AF37);transition:width 1.6s ease}
.more{margin-top:12px;padding:12px 14px;border:1px dashed var(--g);border-radius:14px;background:#14110a}.more p{margin:.4em 0}
.gb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-radius:12px;padding:8px 14px;margin-bottom:14px;font-size:15px;border:1px solid}
.gb.g0{background:#ff8a4c22;border-color:#ff8a4c;color:#ffb98f}.gb.g1{background:#d4af3722;border-color:var(--g);color:var(--gl)}.gb.g2{background:#ffffff0d;border-color:#555;color:var(--m)}
.pal .pb.g0:not(.ok):not(.no):not(.cur){border-color:#ff8a4c}.pal .pb.g1:not(.ok):not(.no):not(.cur){border-color:var(--g)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.gc{background:#111;border:1px solid #3a3010;border-radius:14px;padding:8px;text-align:center;font-size:14px;line-height:1.5}.gc svg{background:#0a0a0a;border-radius:8px}
.tq{background:#14110a;border:1px dashed var(--cy);border-radius:14px;padding:10px 16px;margin:8px 0;color:var(--cy);font-size:18px;line-height:1.8}
.sum p.en{border-right:0;padding-right:0;border-left:3px solid var(--g);padding-left:12px;font-family:Poppins,Cairo,sans-serif}
.hdr{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--g);box-shadow:0 4px 24px #d4af3720}
.hl{display:flex;align-items:center;gap:12px}.cr2{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--gl),var(--g),#a67c00);display:flex;align-items:center;justify-content:center;font-size:24px}
.hn{font-weight:900;font-size:19px;line-height:1.2}.hs{font-size:12px;color:var(--m)}.hw{font-size:16px}
@media(max-width:520px){.hw{display:none}}
.tq[hidden]{display:none}
.qrow .tq{background:none;border:0;border-right:3px solid var(--cy);border-radius:0;padding:4px 12px;margin:6px 0 0}
.qrow .q{margin:0}
.ota{flex:1;direction:rtl;text-align:right;color:var(--cy);font-family:Cairo,sans-serif!important;font-size:18px;padding:3px 12px 0 0;border-right:2px solid #4a3d10}
.ota[hidden]{display:none}
@media(max-width:700px){.o{flex-wrap:wrap}.ota{flex-basis:100%;border-right:0;border-top:1px dashed #4a3d10;padding:6px 0 0}}
.gx{background:#14110a;border:1px solid var(--g);border-radius:16px;padding:14px 16px;margin-top:14px}
.gx .vd{margin:0 0 6px;font-size:20px}.gt{color:var(--gl);font-weight:900;font-size:21px;margin:6px 0 10px;padding-bottom:8px;border-bottom:1px solid #4a3d10}
.gx .pg{background:#0f0d07;border-right:3px solid var(--g);border-radius:10px;padding:8px 16px;margin:10px 0}
.gx .ln{font-size:18px;line-height:2.1;margin:.3em 0;color:var(--t)}
.gx .hd{color:var(--gl);font-weight:900;font-size:19px;margin-top:.5em}
.more2{margin-top:16px;padding:12px 14px;border:1px dashed var(--g);border-radius:14px;background:#14110a}
.tm{background:#0f0d07;border-right:3px solid var(--cy);border-radius:10px;padding:6px 16px;margin:8px 0}
.tt{font-weight:900;color:var(--cy);font-size:19px;text-align:left;font-family:Poppins,Cairo,sans-serif}.tx{color:#fff;font-size:18px;line-height:2}
.chips{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;margin:6px 0 10px}.chip{border:1px solid #6b5a1a;border-radius:20px;padding:2px 14px;font-size:16px;color:var(--gl);background:#0f0d07}
.wel{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.wel h1{margin:0}.wc{font-size:clamp(44px,9vw,68px);line-height:1;filter:drop-shadow(0 0 14px #d4af3780)}
.sc{background:var(--c);border:1px solid #3a3010;border-radius:20px;padding:14px;margin:14px 0}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sb{background:linear-gradient(135deg,var(--gl),var(--g),#a67c00);color:#1a1400;font-weight:900;border-radius:12px;padding:6px 18px}
.sbt{display:flex;gap:8px}.sbt button{padding:8px 18px;font-size:16px}
.sg{display:grid;grid-template-columns:1fr;gap:12px;direction:ltr}
.sg.two{grid-template-columns:1fr 1fr}
.sen,.sar{border-radius:16px;padding:16px;font-size:20px;line-height:2.1;color:#fff;background:#14110a;border:1px solid #2b2410}
.sen{font-family:Poppins,Cairo,sans-serif;font-weight:500}.sen b.k{color:#FFE08A}
.sar{border:1px dashed #6b5a1a;background:#1a1608;font-weight:600}
.sc .ex{margin:12px 0 0;background:linear-gradient(135deg,#0d1b3d,#0a1230);border:1px solid #1e4a9a;border-radius:16px;font-size:19px}
@media(max-width:700px){.sg.two{grid-template-columns:1fr}}
.eb{margin:0 0 14px;padding:6px 14px;font-size:15px}
.sum p{font-size:20px;line-height:2.1;color:#fff;font-weight:600;margin:.8em 0 .4em}
.sum p.en{font-size:20px;font-weight:500;letter-spacing:.2px;line-height:2.1;color:#fff}
.sum p b.k{color:#FFE08A}
.sum .ex p{font-size:18px;font-weight:500;color:#f4efe2;border:0;padding:0;line-height:2}
.tq .ti{margin:.3em 0}.tq .tl{color:#FFE08A;font-weight:900}
</style>

<body>
<div id="preloader"><div class="crown">👑</div><h1>منصة عبدالله العبيدي الذهبية</h1><p>جاري تجهيز تجربة ملكية تليق ببطل البيانات...</p><div class="lb"><i id="loadBar"></i></div></div>
<header class="hdr"><div class="hl"><span class="cr2">👑</span><div><div class="hn">عبدالله <span class="k">العبيدي</span></div><div class="hs">منصة مراجعة الميد • ISY 358</div></div></div><div class="hw k">أهلًا بالبطل 👋</div></header>
<div class="w" id="app"></div>
<script>
const M=(q,o,i,e)=>({t:'M',q,o,i,e}),T=(q,v,e)=>({t:'T',q,o:['True','False'],i:v?0:1,e});
const D=[
{id:'p1',ico:'🔭',n:'الجزء الأول',en:'Lecture 1: Preliminaries & Overview',w:1,
sum:['<b class=k>Data Visualization</b> = تحويل الأرقام والرموز (symbolic) إلى أشكال هندسية (geometric) <span class=c>عشان عقلنا يفهمها أسرع</span> (McCormick 1987).',
'<b class=k>Anscombe’s quartet</b>: 4 مجموعات بيانات ليهم نفس المتوسط والتباين والارتباط (r = 0.82) ونفس الخط، لكن لما ترسمهم بيطلعوا مختلفين تمامًا. <span class=c>الدرس: ارسم الأول قبل ما تحلل.</span>',
'<b class=k>الكائن Object</b> = صف (record / case)، و<b class=k>الخاصية Attribute</b> = عمود (variable / field / feature).',
'أنواع الخصائص بالترتيب: <b class=k>Nominal ← Ordinal ← Interval ← Ratio</b>. كل نوع بياخد خصائص اللي قبله ويزيد عليها. جرّب الأداة تحت 👇',
'<b class=k>3 أنواع للتصوير:</b> Scientific (بيانات هيكلية زي الأشعة)، Information (مالهاش هيكل زي البورصة)، Visual Analytics (تحليل + تفاعل).'],
q:[
M('"Transformation of the symbolic into the geometric" is a definition of data visualization by:',['Bertin 1967','McCormick et al. 1987','Card et al. 1999','Hal Varian 2009'],1,'<p>الجملة دي تعريف <b class=k>McCormick 1987</b>.</p><p>الحيلة: <b class=k>Card</b> = “amplify cognition”، و<b class=k>Bertin</b> = “artificial memory”.</p>'),
M('Anscombe’s quartet was built to show:',['Simple statistics are enough','The importance of graphing data before analyzing it','How to pick colors','Pie vs donut'],1,'<p>المجموعات الأربعة ليهم <b class=k>نفس الإحصاءات</b> بس شكلهم مختلف.</p><p><span class=c>مثال من الواقع:</span> طالبين متوسط درجاتهم واحد، واحد ثابت والتاني بيتذبذب. الرسم بس هو اللي يكشف الفرق.</p>'),
M('Zip codes and employee IDs are examples of which attribute type?',['Nominal','Ordinal','Interval','Ratio'],0,'<p>أرقام الـ ID <b class=k>أسماء بس</b>؛ مفيش معنى لجمعها أو ترتيبها. الخاصية الوحيدة: <b class=k>= ≠</b> (Distinctness).</p>'),
M('Temperature in Celsius is:',['Nominal','Ordinal','Interval','Ratio'],2,'<p><b class=k>Interval</b>: الفرق له معنى (+ −) لكن الصفر مش حقيقي.</p><p><span class=c>مثال:</span> 100°C مش ضعف حرارة 50°C. أما الكلفن (Kelvin) فهو <b class=k>Ratio</b>.</p>'),
M('Which attribute type has all four properties (=, <, +, ×)?',['Interval','Ratio','Ordinal','Nominal'],1,'<p><b class=k>Ratio</b> يملك الأربعة: تمييز + ترتيب + جمع + ضرب.</p><p><span class=c>مثال:</span> 4 جرام = ضعف 2 جرام. الوزن والعمر والطول والعدد كلها Ratio.</p>'),
M('News, the stock market and Facebook connections (no inherent structure) belong to:',['Scientific Visualization','Information Visualization','Visual Analytics','Libraries'],1,'<p><b class=k>Information Visualization</b> = بيانات بدون هيكل مكاني أصلي.</p><p>أما <b class=k>Scientific</b> فللبيانات الهيكلية (زي الزلازل والأشعة الطبية).</p>'),
T('All 4 groups of Anscombe’s quartet have the same mean, variance and correlation, but look different when plotted.',true,'<p><span class=g>صح ✅</span> بالظبط ده سبب وجود المثال: الأرقام وحدها <b class=k>بتخدع</b>.</p>'),
T('An ordinal attribute supports addition and subtraction.',false,'<p><span class=r>خطأ ❌</span> الـ Ordinal ليه <b class=k>تمييز + ترتيب فقط</b>. الجمع والطرح من خصائص <b class=k>Interval</b>.</p>'),
T('100 °C is twice as hot as 50 °C.',false,'<p><span class=r>خطأ ❌</span> السيلسيوس <b class=k>Interval</b> مش Ratio، فالنسب (×÷) ملهاش معنى.</p>'),
T('Binary attributes are a special case of discrete attributes.',true,'<p><span class=g>صح ✅</span> الخاصية الثنائية (نعم/لا) قيمها <b class=k>محدودة</b> يعني Discrete.</p>'),
T('A diverging color scheme is two sequential palettes starting from a common color.',true,'<p><span class=g>صح ✅</span> مثل: زيادة ← أزرق، نقص ← أحمر، <b class=k>والمنتصف محايد</b>.</p>'),
T('Web-based visualization tools require programming skills.',false,'<p><span class=r>خطأ ❌</span> الأدوات الويب <b class=k>سهلة وبدون برمجة</b>؛ اللي بتحتاج كود هي <b class=k>Libraries</b>.</p>'),
M('“The use of computer-generated, interactive, visual representations of data to amplify cognition” is by:',['Bertin 1967','McCormick 1987','Card, Mackinlay & Shneiderman 1999','Anscombe'],2,'<p>كلمة السر <b class=k>amplify cognition</b> = Card 1999.</p>'),
M('According to Hal Varian, the complementary scarce factor (since data is free and ubiquitous) is:',['Storage','The ability to understand data and extract value from it','Internet speed','Programmers'],1,'<p>البيانات بقت رخيصة، فالنادر هو <b class=k>الفهم واستخراج القيمة</b>.</p>'),
M('In a data table, an object is also called a:',['Variable','Field','Record / case / instance','Feature'],2,'<p><b class=k>الصف = Object = record, point, case, sample, entity, instance</b>.</p><p>أما العمود (Attribute) = variable, field, feature.</p>'),
M('Which transformation is allowed for Nominal attributes?',['Any permutation of values','Monotonic function','a·x + b','a·x'],0,'<p>لو غيرنا أرقام الـ ID كلها، مفيش فرق. <b class=k>Nominal: أي إعادة ترتيب</b>.</p><p>Ordinal: monotonic، Interval: a·x+b، Ratio: a·x.</p>'),
M('The transformation new_value = a·old_value + b belongs to:',['Nominal','Ordinal','Interval','Ratio'],2,'<p>مثال: C إلى F. الفرق في <b class=k>مكان الصفر وحجم الوحدة</b>.</p>'),
M('Which is a continuous attribute?',['Zip code','Counts','Weight','Words in documents'],2,'<p><b class=k>Continuous</b>: حرارة، طول، وزن (floating-point). الباقي Discrete.</p>'),
M('A scheme whose colors have no perceived order is:',['Sequential','Diverging','Qualitative','Binary'],2,'<p><b class=k>Qualitative</b> لتمييز الفئات (زراعة/صناعة/خدمات). Sequential له ترتيب.</p>'),
T('An attribute is also known as a variable, field, characteristic or feature.',true,'<p><span class=g>صح ✅</span> الأعمدة = Attributes.</p>'),
T('The same attribute can be mapped to different attribute values, e.g. height in feet or meters.',true,'<p><span class=g>صح ✅</span> نفس الخاصية بقيم مختلفة حسب وحدة القياس.</p>'),
T('Ratio attributes allow only distinctness and order.',false,'<p><span class=r>خطأ ❌</span> Ratio له <b class=k>الأربع خصائص</b>، وده الفرق عن Ordinal.</p>'),
T('Rankings and grades are ordinal attributes.',true,'<p><span class=g>صح ✅</span> فيها ترتيب بس الفروق غير مضمونة.</p>'),
T('In the taxonomy of data types, trees represent hierarchies and networks represent graphs.',true,'<p><span class=g>صح ✅</span> Trees = hierarchies، Networks = graphs.</p>'),
T('Visual Analytics integrates interactive visualization with analysis techniques.',true,'<p><span class=g>صح ✅</span> ويتعامل مع بيانات متعددة الوسائط (صوت، فيديو، نص).</p>'),
T('Libraries are suitable for non-programmers because no code is needed.',false,'<p><span class=r>خطأ ❌</span> Libraries تحتاج <b class=k>برمجة</b> وتناسب المطورين.</p>'),
M('“...finding the artificial memory that best supports our natural means of perception” is by:',['Card 1999','Bertin 1967','McCormick 1987','Varian 2009'],1,'<p>كلمة <b class=k>artificial memory</b> = Bertin 1967.</p>'),
M('A sequential color scheme has:',['No order','A perceived order with uniform difference between successive colors','Two palettes from a common color','Only two colors'],1,'<p><b class=k>Sequential</b> = نفس اللون من فاتح لغامق، مثل نسبة العاملين في الخدمات.</p>'),
M('A map of the change in labor share (increase / decrease) best fits which color scheme?',['Qualitative','Sequential','Diverging','None'],2,'<p><b class=k>Diverging</b> = اتجاهين (زيادة/نقص) من لون مشترك في المنتصف.</p>'),
M('Blueprints, photographs and seismographs are examples of:',['Record information','Analyze data','Communicate information','Inspire'],0,'<p>دي قيمة <b class=k>تسجيل المعلومات</b>.</p>'),
M('Which tools suit small-to-medium datasets that must be uploaded, with no programming?',['Libraries','Web-based tools','Visual Analytics','Scientific Visualization'],1,'<p><b class=k>Web-based tools</b>: سهلة، بدون كود، ولازم ترفع البيانات.</p>'),
M('A complete enterprise solution with self-service for business users is a:',['Library','Web-based tool','Data Analytics and Visualization Platform','Spreadsheet'],2,'<p><b class=k>Platform</b>: بتربط بـ DBMS وتعمل dashboards وتعاون بالفريق.</p>'),
T('Seismic and medical data are examples of Scientific Visualization.',true,'<p><span class=g>صح ✅</span> بيانات <b class=k>هيكلية</b>.</p>'),
T('Qualitative color schemes have a perceived order.',false,'<p><span class=r>خطأ ❌</span> Qualitative = <b class=k>بدون ترتيب</b>.</p>'),
T('The stock market is an example of making decisions with visualization.',true,'<p><span class=g>صح ✅</span> وكمان متابعة المرضى في المستشفيات.</p>'),
T('Zip codes are an example of an interval attribute.',false,'<p><span class=r>خطأ ❌</span> هي <b class=k>Nominal</b>.</p>'),
T('In the taxonomy of data types, maps are 2D and shapes are 3D.',true,'<p><span class=g>صح ✅</span> 1D مجموعات، 2D خرائط، 3D أشكال، nD علاقية.</p>'),
T('Temperature in Kelvin is a ratio attribute.',true,'<p><span class=g>صح ✅</span> لأن الصفر حقيقي.</p>')]},
{id:'p2',ico:'🎨',n:'الجزء الثاني',en:'Chapter 1: Introduction to Data Visualization',w:2,
sum:['<b class=k>تصوير البيانات = فن + علم</b>: لازم تنقل البيانات بدقة <span class=c>بدون تضليل</span>، وفي نفس الوقت شكل جذاب.',
'<b class=k>الجمهور:</b> العلماء بيفهموا البيانات بس ممكن ينقصهم الذوق، والمصممين بيعملوا أشكال حلوة بس ممكن يضحّوا بالدقة.',
'<b class=k>تصنيف الأشكال:</b> <span class=r>Ugly</span> = مشكلة جمالية، <span class=r>Bad</span> = مشكلة إدراك، <span class=r>Wrong</span> = خطأ رياضي. جرّب الأداة تحت 👇',
'<b class=k>Aesthetics</b> = الخصائص اللي بنربط بيها القيم: position, shape, size, color, line width, line type.',
'<b class=k>أنواع المتغيرات:</b> continuous / discrete (كمي)، unordered / ordered (نوعي)، date/time، text.'],
q:[
M('A figure with loud clashing colors and heavy grid lines but correct values is:',['Ugly','Bad','Wrong','Perfect'],0,'<p><b class=k>Ugly</b> = مشكلة <b class=k>جمالية</b> بس، والأرقام سليمة.</p>'),
M('Each bar drawn on its own separate y-axis, making comparison hard, is:',['Ugly','Bad','Wrong','Qualitative'],1,'<p><b class=k>Bad</b> = مشكلة <b class=k>إدراك</b> (perception).</p><p>العين مش قادرة تقارن الأعمدة لأن كل واحد بمقياس مختلف.</p>'),
M('Bar heights that do not match the data values make a figure:',['Ugly','Bad','Wrong','Sequential'],2,'<p><b class=k>Wrong</b> = <b class=k>خطأ رياضي</b>؛ الرسم بيكذب على القيم.</p>'),
M('Which is NOT one of the common aesthetics?',['Position','Line type','Data source','Size'],2,'<p>الـ aesthetics: <b class=k>position, shape, size, color, line width, line type</b>.</p><p>“مصدر البيانات” مش خاصية رسم.</p>'),
M('“dog, cat, fish” is which type of variable?',['Qualitative unordered','Qualitative ordered','Quantitative discrete','Text'],0,'<p>فئات <b class=k>بدون ترتيب</b>، وتسمى factors.</p>'),
M('“good, fair, poor” is which type of variable?',['Qualitative unordered','Quantitative continuous','Date or time','Qualitative ordered'],3,'<p>فئات <b class=k>لها ترتيب</b> (fair دايمًا في النص)، وتسمى ordered factors.</p>'),
T('Data visualization is a combination of art and science.',true,'<p><span class=g>صح ✅</span> التحدي هو <b class=k>التوازن</b> بين الدقة العلمية والجمال.</p>'),
T('Designers may create attractive figures but compromise data accuracy.',true,'<p><span class=g>صح ✅</span> المصمم يهمه الشكل، والعالم تهمه الدقة، <b class=k>والهدف إرضاء الاتنين</b>.</p>'),
T('Scientists always have a strong sense of visual aesthetics.',false,'<p><span class=r>خطأ ❌</span> الشرائح بتقول إنهم <b class=k>قد ينقصهم</b> الحس الجمالي.</p>'),
T('A date/time variable can be treated as continuous or discrete.',true,'<p><span class=g>صح ✅</span> التاريخ محدد (يوم) أو متصل (خط زمني).</p>'),
T('The “multiple scales” example uses five scales: x, y, color, size and shape.',true,'<p><span class=g>صح ✅</span> مثال: x = displacement، y = mpg، لون = hp، حجم = وزن، شكل = cylinders.</p>'),
T('Free-form text can never be treated as a categorical variable.',false,'<p><span class=r>خطأ ❌</span> النص <b class=k>ممكن</b> يتعامل ككيان فئوي لو احتجنا.</p>'),
M('Mapping data values to quantifiable features such as position, size and color uses:',['Attributes','Aesthetics','Objects','Factors'],1,'<p>الخصائص دي اسمها <b class=k>Aesthetics</b>، والـ scales بتربط القيم بيها.</p>'),
M('In the temperature example (left plot), temperature is mapped to:',['x-axis','Line color','y-axis','Shape'],2,'<p>الحرارة ← <b class=k>y</b>، اليوم ← x، المكان ← لون الخط.</p>'),
M('In the alternative (right) plot, temperature is shown using:',['Squares and color','Line type','Bars only','Text'],0,'<p>تمثيل بديل: <b class=k>مربعات + لون</b> للحرارة.</p>'),
M('The values 1, 2, 3, 4 as numbers in discrete units are:',['Quantitative discrete','Quantitative continuous','Qualitative unordered','Text'],0,'<p><b class=k>Quantitative discrete</b>: وحدات منفصلة.</p>'),
M('A good visualization should:',['Add decorations','Enhance the message and avoid distracting elements','Use as many colors as possible','Hide scale'],1,'<p>القاعدة: <b class=k>ادعم الرسالة وشيل المشتتات</b>.</p>'),
M('Principles in the chapter are divided into:',['Types of plots, and aesthetic figure design','Only colors','Only statistics','Tools and libraries'],0,'<p>التقسيم: <b class=k>من البيانات إلى الرسم</b> و<b class=k>مبادئ تصميم الشكل</b>.</p>'),
M('Dates like Jan. 5 2018, 8:03am are which variable type?',['Date or time','Text','Qualitative ordered','Quantitative discrete only'],0,'<p><b class=k>Date/time</b> وتناسب continuous أو discrete.</p>'),
T('Different aesthetics suit different data types, some continuous and others discrete.',true,'<p><span class=g>صح ✅</span> مثل position للمتصل وshape للفئات.</p>'),
T('Position, shape, size, color, line width and line type are common aesthetics.',true,'<p><span class=g>صح ✅</span> السته المعتمدة.</p>'),
T('An Ugly figure has mathematical inaccuracies.',false,'<p><span class=r>خطأ ❌</span> Ugly = <b class=k>جمالية</b>، أما الرياضية فهي Wrong.</p>'),
T('A Bad figure has perception issues.',true,'<p><span class=g>صح ✅</span> مثل أعمدة بمحاور y مختلفة.</p>'),
T('0.5, 1.0, 1.5 can be treated as discrete if intermediate values cannot exist.',true,'<p><span class=g>صح ✅</span> المهم هل القيم الوسيطة ممكنة.</p>'),
T('Qualitative ordered variables are also called ordered factors.',true,'<p><span class=g>صح ✅</span> مثل good/fair/poor.</p>'),
T('The goal is to provide valuable information to both scientists and designers.',true,'<p><span class=g>صح ✅</span> الجمهور فئتان.</p>'),
M('The example temperature dataset includes variables such as:',['Month, day, location, station ID, temperature','Price and cost','Age and gender','Color and size'],0,'<p>الداتاست: <b class=k>شهر، يوم، مكان، ID المحطة، حرارة</b>.</p>'),
M('A complex visualization with x, y, color, size and shape scales has how many scales?',['3','4','5','6'],2,'<p><b class=k>خمسة</b> scales: كل واحد لمتغير.</p>'),
M('Which aesthetic is a good fit for discrete categories?',['Shape','Position on a continuous axis only','Line width only','None'],0,'<p><b class=k>Shape</b> واللون للفئات، وposition للمتصل.</p>'),
M('Qualitative variables without order are also called:',['Ordered factors','Factors','Scales','Dates'],1,'<p><b class=k>Factors</b> للمتغيرات بدون ترتيب.</p>'),
M('Which gives the appropriate scale for a “text” variable?',['Continuous','None, or discrete','Ratio','Interval'],1,'<p>النص: <b class=k>مفيش scale أو discrete</b>.</p>'),
T('Quantitative continuous variables can be integers, rational or real numbers.',true,'<p><span class=g>صح ✅</span> قيم اشتراكية اختيارية.</p>'),
T('Date/time variables are always discrete.',false,'<p><span class=r>خطأ ❌</span> <b class=k>continuous أو discrete</b>.</p>'),
T('Visualization converts data values into visual elements systematically.',true,'<p><span class=g>صح ✅</span> الـ scales هي الرابط.</p>'),
T('Wrong figures are those with aesthetic problems.',false,'<p><span class=r>خطأ ❌</span> Wrong = <b class=k>رياضية</b>.</p>'),
T('Position and color are both examples of aesthetics.',true,'<p><span class=g>صح ✅</span> مع shape وsize وline width وline type.</p>'),
M('What does data visualization help people do?',['Understand data faster and more clearly','Make data take longer to read','Replace data with guesses','Hide important details'],0,'<p>التصوير بيحوّل الأرقام لأشكال <b class=k>عشان نفهم البيانات أسرع وأوضح</b>. باقي الاختيارات عكس الهدف.</p>'),
M('What is the main purpose of data visualization?',['To store data safely','To write long reports','To help people see patterns and trends in data','To memorize numbers by heart'],2,'<p>الهدف الأساسي: <b class=k>إنك تشوف الأنماط (patterns) والاتجاهات (trends)</b> في البيانات بسهولة. التخزين مش وظيفة التصوير.</p>'),
M('What is a data source?',['The color palette used','A type of chart','Where the data came from','The person who created the chart'],2,'<p><b class=k>Data source = مصدر البيانات</b>، يعني البيانات جت منين. وبنكتبه في الرسم عشان الناس تثق فيه.</p>'),
M('Why should you avoid too many colors in one chart?',['To save ink','To scare viewers','To prevent confusion and make it easy to read','To use every color available'],2,'<p>كتر الألوان <b class=k>بتشتت القارئ</b>. القاعدة: ألوان قليلة تخدم الرسالة وتسهّل القراءة.</p>'),
M('Color in charts should be used to?',['Emphasize differences and highlight important parts','Make the chart harder to read','Replace numbers with colors','Hide missing data'],0,'<p>اللون وظيفته <b class=k>إبراز الفروق والأجزاء المهمة</b>، مش الزينة ولا بديل عن الأرقام.</p>'),
M('Why is labeling a chart important?',['It helps people understand what the chart shows','It is required by teachers anyway','It hides the data sources','It makes the chart look fancy'],0,'<p>الـ labels والعناوين <b class=k>بتفهّم القارئ الرسم بيعرض إيه</b>. الرسم من غيرها غامض.</p>'),
M('When can a chart be considered misleading?',['When the axes or scale distort the data','When it uses only one color','When it is printed on paper','When it has no labels'],0,'<p>الرسم بيبقى <b class=k>مضلل</b> لما المحاور أو المقياس (scale) يشوّهوا شكل البيانات، زي محور y مش بادئ من صفر.</p>'),
M('What should you check to avoid misrepresenting data?',['The axis scale, especially starting at zero','The date of the data','How many people will read the chart','The color of every bar'],0,'<p>راجع <b class=k>مقياس المحور وخصوصًا إنه يبدأ من صفر</b>، لأن البداية من رقم تاني بتضخّم الفروق الصغيرة.</p>')]},
{id:'p3',ico:'📊',n:'الجزء الثالث',en:'Lecture 2: Basic Charts and Plots',w:3,
sum:['<b class=k>Scatter plot</b>: يوضح <span class=c>العلاقة بين متغيرين</span>. ارتباط <b class=g>موجب</b> (الاتنين يزيدوا)، <b class=r>سالب</b> (واحد يزيد والتاني ينقص)، أو <b class=k>معدوم</b> (نقط عشوائية). جرّب 👇',
'<b class=k>Line of best fit</b> = خط الاتجاه؛ <span class=c>لازم ما يمرش على كل النقط</span>، وبنستخدمه للتنبؤ.',
'<b class=k>Line graph</b> للتغير مع الزمن. <b class=k>Histogram</b>: أعمدة ملتصقة لبيانات متصلة، عكس الـ Bar chart (فئات بينها فراغ).',
'<b class=k>Stacked bar</b>: كل عمود كامل وأجزاؤه مكدسة (Simple أو 100%). <b class=k>Range bar</b>: الحد الأدنى والأقصى فقط. <b class=k>Bullet</b>: Feature Measure مقابل الهدف.',
'<b class=k>Box plot</b>: الربيعيات Q1, Q2 (median), Q3 و<b class=k>IQR = Q3 − Q1</b>. <b class=k>Pie</b>: تصلح مع 2 إلى 4 فئات فقط. <b class=k>Donut</b>: دائرة وسطها فاضي.'],
q:[
M('What is the primary use of a scatter plot?',['Displaying time trends','Showing the relationship between two variables','Comparing parts of a whole','Showing min and max'],1,'<p>سؤال جه في الامتحان السابق ✅.</p><p>الـ scatter يوضح <b class=k>الارتباط (correlation)</b> بين متغيرين.</p>'),
M('A histogram differs from a bar chart because it:',['Has a legend','Has no gaps between bars and uses continuous intervals','Shows parts of a whole','Uses categories with gaps'],1,'<p><b class=k>Histogram</b> = أعمدة ملتصقة لمدى متصل (ساعات، درجات).</p><p><b class=k>Bar chart</b> = فئات منفصلة.</p>'),
M('In a box plot, IQR equals:',['Max − Min','Q3 − Q1','Mean of all data','Q2'],1,'<p><b class=k>IQR = Q3 − Q1</b>، يعني مدى النص الأوسط من البيانات.</p><p>Q2 هي الوسيط (median).</p>'),
M('In a bullet chart, the main value encoded by the length of the central bar is called the:',['Comparative Measure','Feature Measure','Baseline','Range'],1,'<p><b class=k>Feature Measure</b> = القيمة الأساسية. أما <b class=k>Comparative Measure</b> فهي علامة الهدف.</p>'),
M('A range bar chart emphasizes:',['Frequency within bins','The minimum and maximum of each category','Share of the total','Time between points'],1,'<p>يسمى كمان <b class=k>Floating Bar / Span Chart</b> ويركز على <b class=k>الطرفين فقط</b>.</p>'),
M('A pie chart works best with:',['Many categories','Time series','A few classes (2–4) forming 100%','Negative values'],2,'<p>الـ Pie للنسب من <b class=k>100%</b> وبفئات قليلة. لو أكثر استخدم Bar chart.</p>'),
T('If rx,y = 0 then x and y are independent.',true,'<p><span class=g>صح ✅</span> حسب شرائح الدكتور: صفر = لا علاقة. وr = 0.72 = ارتباط موجب نسبيًا.</p>'),
T('The line of best fit must pass through every data point.',false,'<p><span class=r>خطأ ❌</span> <b class=k>مش لازم</b> يمر بأي نقطة؛ المهم يمثل الاتجاه العام.</p>'),
T('Stacked area charts work well with negative values.',false,'<p><span class=r>خطأ ❌</span> بتستخدم <b class=k>المساحة</b> لتمثيل الأرقام الموجبة، فمابتنفعش مع السالب.</p>'),
T('A donut chart is a pie chart with the centre cut out.',true,'<p><span class=g>صح ✅</span> والمساحة الفاضية بتتحط فيها <b class=k>معلومة إضافية</b>.</p>'),
T('A line graph is suitable for showing how many people like pizza in a class.',false,'<p><span class=r>خطأ ❌</span> الـ line للزمن فقط؛ “مين بيحب البيتزا” فئات = <b class=k>Bar chart</b>.</p>'),
T('A bubble chart can show more than two variables.',true,'<p><span class=g>صح ✅</span> المحوران + <b class=k>حجم الفقاعة</b> = 3 متغيرات (سؤال من الامتحان السابق).</p>'),
M('Which axis is typically horizontal in a line graph?',['y-axis','x-axis','z-axis','Secondary axis'],1,'<p>الـ <b class=k>x</b> أفقي دايمًا (الزمن غالبًا)، والـ <b class=k>y</b> رأسي.</p><p>الفواصل على y لازم تكون <b class=k>متساوية</b>.</p>'),
M('Which chart compares two related data sets side by side?',['Area chart','Bullet chart','Double bar chart','Histogram'],2,'<p><b class=k>Double bar</b> = عمودين لكل فئة بلونين مختلفين (مثال: حضري وريفي) مع <b class=k>key</b> يشرح الألوان.</p>'),
M('A 100% stacked bar chart is designed to show:',['Exact values only','The average','The relative contribution of each part as a percentage of the whole','Time order'],2,'<p>نوعا الـ stacked: <b class=k>Simple</b> (القيم الفعلية) و<b class=k>100%</b> (النسب).</p>'),
M('Which chart is a line graph with the area below the line filled in?',['Area chart','Donut chart','Scatter plot','Box plot'],0,'<p>سؤال من الامتحان السابق ✅. بيوضح <b class=k>الاتجاه</b> أكتر من القيم الدقيقة.</p>'),
M('mtcars$gear has values 4 4 4 3 3. What does mtcars$gear*2 return?',['4 4 4 3 3','8 8 8 6 6','2 2 2 1 1','8'],1,'<p>في R الضرب بيتم على <b class=k>كل عنصر</b> في الـ vector: 4×2 = 8 و3×2 = 6.</p><p>الرمز <b class=k>$</b> بيختار عمود من الجدول.</p>'),
M('mtcars$mpg is 21.0, 21.0, 22.8, 21.4, 18.7. What does min(mtcars$mpg) return?',['21.0','22.8','18.7','5'],2,'<p><b class=k>min</b> بترجع <b class=k>أصغر قيمة</b> = 18.7. و<b class=k>max</b> هتبقى 22.8.</p>'),
M('For 53 65 68 69 70 72 72 79 83 84 85 87 89 90 94 (15 values), Q2 is:',['69','79','87','72'],1,'<p><b class=k>Q2 = الوسيط</b>، والقيمة رقم 8 من 15 هي <b class=k>79</b> (سؤال الامتحان السابق).</p><p>Q1 = 69 و Q3 = 87.</p>'),

const MORE=[["def", "symbolic|amplify|artificial memory|defin.* of data vis|data visualization by", "<b class=k>التعريفات الثلاثة (محاضرة 1):</b> <b class=c>McCormick 1987</b> = تحويل الرموز (symbolic) لأشكال هندسية (geometric). <b class=c>Card, Mackinlay & Shneiderman 1999</b> = تمثيلات بصرية تفاعلية مولّدة بالحاسب لـ<b class=k>تعزيز الإدراك (amplify cognition)</b>. <b class=c>Bertin 1967</b> = إيجاد «الذاكرة الاصطناعية» اللي تدعم أفضل طرق إدراكنا الطبيعية. اربط كل تعريف بكلمته المفتاحية وهتحل أي سؤال نسب."], ["varian", "Varian|scarce|ubiquitous", "<b class=k>Hal Varian</b> (كبير اقتصاديي Google، McKinsey Quarterly يناير 2009): القدرة على فهم البيانات ومعالجتها واستخراج قيمتها وتصويرها وإيصالها ستكون <b class=k>مهارة مهمة جدًا في العقود الجاية</b>. السبب: البيانات بقت <b class=c>مجانية ومتوفرة في كل مكان</b>، فالعامل النادر المكمّل لها هو <b class=k>القدرة على فهمها واستخراج القيمة منها</b> (مش التخزين ولا سرعة النت)."], ["anscombe", "Anscombe|outlier", "<b class=k>رباعية أنسكومب</b> (الإحصائي Francis Anscombe): 4 مجموعات كل واحدة 11 نقطة، ولهم <b class=c>نفس</b> mean(x)=9 وmean(y)=7.5 وvar(x)=11 وvar(y)≈4.12 وcorrelation=0.82 ونفس الخط <b class=k>y = 3.00 + 0.5x</b>. لكن الرسم يكشف: (1) علاقة خطية عادية، (2) منحنى، (3) خط مستقيم تقريبًا مع <b class=r>outlier</b> واحد، (4) كل x=8 ما عدا نقطة واحدة بعيدة تسحب الخط. <b class=k>الدرس:</b> الإحصاءات البسيطة لا تكفي؛ ارسم البيانات قبل التحليل، والقيم الشاذة تأثر على الخصائص الإحصائية."], ["why", "silk|decision|context|expand memory|find patterns|inspire|reason to create|Walmart|stock market|hospital|seismograph|blueprint|support reasoning|communicate info|record info|value of vis", "<b class=k>ليه نعمل Visualization (7 أسباب):</b> نجاوب أسئلة (طريق الحرير) • نتخذ قرارات (البورصة، مراقبة المستشفيات) • نشوف البيانات في سياقها (الخريطة) • نوسّع الذاكرة (عملية الضرب) • نكتشف الأنماط (بيانات الفلك) • نعرض حجة/قصة (نمو Walmart) • نلهم (كتاب طب/جينوم/DNA). <b class=k>قيمة التصوير (3):</b> <b class=c>Record</b> تسجيل (مخططات، صور، seismographs) • <b class=c>Analyze</b> تحليل لدعم الاستنتاج (فرضيات، أخطاء، ذاكرة، أنماط) • <b class=c>Communicate</b> إيصال (مشاركة وإقناع، تعاون ومراجعة). مثال المخ: جدول Excel ما يجاوب، لكن scatter بمقياس log يوضح أقوى مخ."], ["obj", "record|instance|object|attribute is|collection of attributes|variable, field|Tid|feet|meters|same attribute|ID and age", "<b class=k>البيانات = مجموعة كائنات (Objects) وخصائصها (Attributes).</b> في الجدول: <b class=c>الأعمدة = Attributes</b> (variable, field, characteristic, feature) و<b class=c>الصفوف = Objects</b> (record, point, case, sample, entity, instance). <b class=k>قيم الخاصية</b> أرقام أو رموز معطاة لها. نفس الخاصية قد تأخذ قيمًا مختلفة (الطول بالقدم أو بالمتر). وخصائص مختلفة قد تشترك في نفس مجموعة القيم (ID والعمر أعداد صحيحة)، <b class=r>لكن خصائصهم تختلف</b>: الـ ID بلا حد، والعمر له حد أدنى وأقصى."], ["types", "Nominal|Ordinal|Interval|Ratio|distinct|permutation|monotonic|Kelvin|Celsius|twice|zip|grades|ranking", "<b class=k>أنواع الخصائص وما تملكه:</b> <b class=c>Nominal</b> = تمييز فقط (= ≠): ID، لون العين، الرمز البريدي، الجنس. <b class=c>Ordinal</b> = تمييز + ترتيب (&lt; &gt;): التقديرات، good/better/best، صلابة المعادن، أرقام الشوارع. <b class=c>Interval</b> = + جمع/طرح (الفرق له معنى): التواريخ، Celsius/Fahrenheit (صفره مش حقيقي). <b class=c>Ratio</b> = + ضرب/قسمة (الفرق والنسبة): Kelvin، الطول، الوقت، العدد، المبالغ، العمر، الكتلة. <b class=k>التحويلات:</b> Nominal أي إعادة ترتيب • Ordinal دالة monotonic (تحافظ على الترتيب) • Interval a·x+b • Ratio a·x. وFahrenheit وCelsius يختلفان في مكان الصفر وحجم الوحدة."], ["disc", "discrete|continuous|binary|floating|integer|countabl", "<b class=k>Discrete:</b> قيمها محدودة أو لانهائية قابلة للعد (رموز بريدية، أعداد، كلمات المستندات) وغالبًا integers، والـ <b class=c>binary حالة خاصة منها</b>. <b class=k>Continuous:</b> أعداد حقيقية (حرارة، طول، وزن) وتُمثّل عادة floating-point؛ عمليًا تُقاس بعدد محدود من الخانات."], ["tax", "taxonomy|Trees|hierarch|Networks|1D|nD|Multivariate|Semi-Structured|types of data", "<b class=k>تصنيف أنواع البيانات:</b> 1D (مجموعات وتسلسلات) • Temporal (زمني) • 2D (خرائط/مكاني) • 3D (أشكال) • nD (علائقي) • <b class=c>Trees = هرميات</b> • <b class=c>Networks = رسوم/شبكات</b> • Combination (مثل مكاني+زمني). وأنواع أخرى: Multivariate, Text, Time Series, Geospatial, Hierarchical, Network, Numerical, Categorical, Structured, Semi/Unstructured."], ["tv", "Scientific|Information Vis|Visual Analytics|multimodal|ParaView", "<b class=k>أنواع تصوير البيانات:</b> <b class=c>Scientific</b> = بيانات هيكلية (زلازل، طبية؛ مثال ParaView مفتوح المصدر). <b class=c>Information</b> = ما لها هيكل أصلي (أخبار، البورصة، أعلى الأفلام، علاقات فيسبوك). <b class=c>Visual Analytics</b> = دمج التصوير التفاعلي مع تقنيات التحليل لفهم كميات كبيرة من بيانات متعددة الوسائط (صوت، فيديو، نص، صور)."], ["tools", "librar|Web-based|Platform|programming|developers|self-service|enterprise", "<b class=k>أدوات التصوير (3 فئات):</b> <b class=c>Libraries</b>: تضيف قدرات الرسم للتطبيقات، تحتاج برمجة، للمطورين. <b class=c>Web-based</b>: سهلة بدون برمجة، لازم ترفع البيانات، تناسب البيانات الصغيرة/المتوسطة. <b class=c>Data Analytics &amp; Visualization Platform</b>: حل متكامل (enterprise-class): اتصال بقواعد البيانات، استكشاف وتحليل بصري، لوحات معلومات، تعاون ومشاركة، برمجة قليلة أو معدومة، وself-service لمستخدمي الأعمال."], ["choice", "chart choicer|What would you like to show|Composition|Distribution|Comparison|Waterfall|Circular Area|Bubble|three variables|simple share", "<b class=k>مختار الرسم (Chart Choicer):</b> ابدأ بسؤال «وش تبي تعرض؟» ← 4 أهداف: <b class=c>Comparison, Relationship, Distribution, Composition</b> (مو Prediction). Relationship: متغيران ← Scatter، ثلاثة ← Bubble. Composition ثابت: حصة بسيطة ← Pie، تراكم/طرح ← Waterfall، مكونات داخل مكونات ← Stacked 100% مع subcomponents. مقارنة عبر الزمن: فترات كثيرة بيانات دورية ← Circular Area، غير دورية ← Line."], ["color", "color scheme|Qualitative|Sequential|Diverging|palette|perceived order|ColorBrewer|Brewer", "<b class=k>أنظمة الألوان (Cynthia Brewer):</b> <b class=c>Qualitative</b> = لا ترتيب محسوس، لتمييز الفئات (مثال: القطاع المسيطر 1960؛ set1, set2, pastel2, dark2). <b class=c>Sequential</b> = ترتيب محسوس والفرق بين الألوان المتتالية متساوٍ (نسبة العاملين في الخدمات 1980؛ blues, greens, reds). <b class=c>Diverging</b> = لوحتان متسلسلتان من لون مشترك في المنتصف (التغير في نسبة العاملين في الصناعة؛ spectral, rdylbu). وهناك Binary (نعم/لا)."], ["art", "art and science|Scientists|Designers|balance|combination of|challenge", "<b class=k>مقدمة الفصل 1:</b> التصوير مزيج <b class=c>فن وعلم</b>، هدفه نقل البيانات بدقة بدون تضليل أو تشويه. <b class=k>التحدي:</b> التوازن بين الدقة العلمية والجاذبية الجمالية، والتصوير الجيد يقوّي الرسالة ويتجنب العناصر المشتتة. <b class=k>الجمهور:</b> العلماء يفهمون البيانات وقد ينقصهم الحس الجمالي، والمصممون يصنعون أشكالًا جذابة وقد يضحّون بدقة البيانات."], ["ugly", "Ugly|Bad|Wrong|clashing|separate y-axis", "<b class=k>تصنيف الأشكال (مثال أعمدة A=3, B=5, C=4):</b> <b class=c>Ugly</b> = مشكلة جمالية (القيم صحيحة لكن ألوان صارخة وخطوط شبكة ثقيلة). <b class=c>Bad</b> = مشكلة إدراك (كل عمود على محور y مستقل فيصعب المقارنة). <b class=c>Wrong</b> = خطأ رياضي (أطوال الأعمدة لا تطابق القيم)."], ["aes", "aesthetic|position|line width|line type|shape, size", "<b class=k>Aesthetics:</b> الخصائص المرئية اللي نربط بها قيم البيانات (لغة مشتركة بين أنواع الرسوم): <b class=c>position, shape, size, color, line width, line type</b>. بعضها يناسب البيانات المتصلة وبعضها المنفصلة. وليس منها «مصدر البيانات»."], ["vars", "unordered|ordered factors|date or time|text variable|quantitative|qualitative|categorical|dog, cat|good, fair|0\\.5", "<b class=k>أنواع المتغيرات (6):</b> كمي متصل (continuous) • كمي منفصل (discrete: غالبًا integers لكن 0.5, 1.0, 1.5 منفصلة لو القيم الوسيطة لا توجد) • نوعي بدون ترتيب (dog, cat, fish؛ تسمى <b class=c>factors</b>) • نوعي مرتب (good, fair, poor؛ <b class=c>ordered factors</b>) • تاريخ/وقت (متصل أو منفصل) • نص (none أو discrete، ويعامل كـ categorical عند الحاجة)."], ["scales", "scale|mapped|mapping|Multiple Scales|five|temperature normals|displacement", "<b class=k>المقاييس (Scales):</b> تربط قيم البيانات بالـ aesthetics (القيم 1,2,3,4 ← position أو shape أو color). مثال Practical: temperature ← محور y، يوم السنة ← x، الموقع ← لون الخط؛ وبديله مربعات ولون. ومثال Multiple Scales: x=displacement, y=fuel efficiency, color=power, size=weight, shape=cylinders (خمسة مقاييس)."], ["scatter", "scatter|correlation|best fit|trend line|rx,y|r =|tornado|relationship between|whisker", "<b class=k>Scatter &amp; Correlation:</b> أفضل طريقة لرؤية العلاقة بين متغيرين، وتبيّن مدى قرب النقاط من خط. ارتباط <b class=g>موجب</b> (الاثنان يزيدان) • <b class=r>سالب</b> (واحد يزيد والآخر ينقص) • ضعيف/معدوم (نقاط عشوائية). <b class=k>خط أفضل ملاءمة</b> يطابق الاتجاه العام ولا يلزم أن يمر بأي نقطة، ويُستخدم للتنبؤ (تورنادو: 1200 متوقعة في 2015). النقاط القريبة منه = ارتباط قوي. <b class=k>r = 0</b> ← مستقلان؛ r&gt;0 موجب؛ r&lt;0 سالب؛ مثال محلول r≈0.72 ← موجب نسبيًا."], ["line", "line graph|line chart|horizontal flat|change over time|East Meadow|rain", "<b class=k>Line graph:</b> لإظهار التغير مع الزمن (ثواني..قرون). له دائمًا عنوان، ومحوران (x أفقي، y رأسي) عادة يبدآن من الصفر وفواصل y متساوية، وخط أفقي مسطح = لا تغيّر. مناسب: كمية المطر كل شهر. غير مناسب: عدد من يحبون البيتزا أو سكان منطقة (ليست زمنية). انتبه: تغيير مدى المحور يضخّم الهبوط."], ["area", "area chart|Area Charts|stacked area|negative values|Cumulative", "<b class=k>Area chart:</b> Line graph مع تعبئة المساحة تحت الخط بلون/نسيج؛ يبيّن الاتجاهات والعلاقات لا القيم الدقيقة. <b class=k>Stacked Area:</b> سلاسل متعددة كل نقطة تبدأ من حيث انتهت السابقة، والرسم كله = المجموع، لذلك <b class=r>لا يصلح للقيم السالبة</b>، ويفيد لمقارنة عدة متغيرات عبر فترة."], ["bar", "bar chart|Bar Chart|Double|histogram|Histogram|stacked bar|Stacked Bar|100%|space between", "<b class=k>عائلة الأعمدة:</b> Bar = فئات بينها فراغ. <b class=k>Double/Multiset</b> = مقارنة مجموعتين (أو أكثر) مترابطتين، بألوان مختلفة وعنوان ومفتاح. <b class=k>Histogram</b> = تكرار البيانات في فترات متساوية، أعمدة <b class=c>تتلامس بدون فراغ</b> وكل عمود متغير متصل كمي. <b class=k>Stacked</b> = العمود كل كامل وأجزاؤه مكدسة، نوعان: Simple و100% Stack."], ["range", "Range|range bar|Bullet|Feature Measure|Comparative Measure|target marker", "<b class=k>Range Bar</b> (= Floating Bar / Span Chart): يعرض أدنى وأعلى قيمة لكل فئة، ويركز على القيم الطرفية فقط. <b class=k>Bullet Graph:</b> لبيانات الأداء؛ العمود الرئيسي = <b class=c>Feature Measure</b>، وعلامة الهدف = <b class=c>Comparative Measure</b>، والخلفيات الملونة تمثل نطاقات نوعية (ضعيف، متوسط، ممتاز)؛ الأفضل ألا تزيد النطاقات عن خمسة."], ["box", "box|Q1|Q3|IQR|median|mode|mean|quartile|1\\.5", "<b class=k>Box plot:</b> يقسم البيانات لأربعة أرباع (كل ربع 25%). الخطوات: رتّب ← Q2=الوسيط ← Q1=وسيط النصف الأدنى ← Q3=وسيط النصف الأعلى. <b class=c>IQR = Q3 − Q1</b>. القيمة <b class=r>شاذة</b> لو &gt; Q3 + 1.5·IQR أو &lt; Q1 − 1.5·IQR. لا يعرض التكرار لكنه يبيّن وسط البيانات والالتواء. الوسيط = القيمة الوسطى (أو متوسط الوسطين)، المنوال = الأكثر تكرارًا."], ["pie", "pie|Pie|donut|Donut|annular|degrees|Scissor|slice", "<b class=k>Pie:</b> للنسب من 100%، يعمل أفضل مع 2–4 فئات، عيبه صعوبة مقارنة القيم المتقاربة؛ إرشادات: ضع التسميات قرب الشرائح، رتّب الشرائح بالقيمة، وتجنّب بدء الشرائح عند الساعة 12. <b class=k>Donut:</b> Pie مقصوص المركز، يقلل التركيز على المساحة فيقرأ القارئ أطوال الأقواس، وأوفر مساحة. <b class=k>Annular:</b> مقارنة النسب بين عدة مجموعات بيانات. الزاوية = (القيمة ÷ المجموع) × 360."]];

function pie(m){const c=[['#D4AF37',.4],['#6fd3ff',.35],['#3ddc84',.25]];let a=-Math.PI/2,o='';
const sec=(r,r0,a0,a1,f)=>{const P=(rr,t)=>[80+rr*Math.cos(t),50+rr*Math.sin(t)],l=a1-a0>Math.PI?1:0,A=P(r,a0),B=P(r,a1),C=P(r0,a1),E=P(r0,a0);return `<path d="M${A}A${r} ${r} 0 ${l} 1 ${B}L${C}${r0?`A${r0} ${r0} 0 ${l} 0 ${E}`:''}Z" fill="${f}" stroke="#000" />`.replace(/,/g,' ')};
c.forEach(x=>{const b=a+x[1]*2*Math.PI;if(m==0)o+=sec(42,0,a,b-.001,x[0]);else if(m==1)o+=sec(42,20,a,b-.001,x[0]);else o+=sec(44,32,a,b-.001,x[0])+sec(28,14,a+.5,b+.5-.001,x[0]);a=b});return o}

p1:["<b class=k>Data Visualization</b> turns symbols and numbers into geometric shapes so the brain grasps them faster (McCormick, 1987).",
"<b class=k>Anscombe’s quartet</b>: four datasets share the same mean, variance, correlation (r = 0.82) and fit line, yet look completely different when plotted. Lesson: plot first, analyze second.",
"An <b class=k>Object</b> is a row (record, case); an <b class=k>Attribute</b> is a column (variable, field, feature).",
"Attribute types in order: <b class=k>Nominal → Ordinal → Interval → Ratio</b>. Each type keeps the properties of the previous one and adds more.",
"<b class=k>Three kinds of visualization:</b> Scientific (structured data, e.g. medical scans), Information (no inherent structure, e.g. stock market), Visual Analytics (analysis plus interaction).",

"<b class=k>Seven reasons to visualize:</b> answer questions, make decisions, see data in context, expand memory, find patterns, present an argument, inspire.",
"<b class=k>Three values of visualization:</b> Record (store information), Analyze (support reasoning), Communicate (share and persuade).",
"<b class=k>Four value properties:</b> Distinctness (= ≠), Order (&lt; &gt;), Addition (+ −), Multiplication (× ÷). Nominal has the first; Ratio has all four.",
"<b class=k>Allowed transformations:</b> Nominal – any permutation; Ordinal – monotonic function; Interval – a·x + b; Ratio – a·x.",
"<b class=k>Discrete</b> attributes have finite or countable values (binary is a special case); <b class=k>Continuous</b> attributes are real numbers, usually floating-point.",
"<b class=k>Data taxonomy:</b> 1D, temporal, 2D (maps), 3D, nD, trees (hierarchies), networks (graphs) and combinations.",

p2:["<b class=k>Visualization = art + science:</b> convey data accurately without misleading, while staying attractive.",
"<b class=k>Audience:</b> scientists understand the data but may lack aesthetics; designers make pretty figures but may sacrifice accuracy.",
"<b class=k>Figure labels:</b> Ugly = aesthetic problem, Bad = perception problem, Wrong = mathematical error.",
"<b class=k>Aesthetics</b> are the visual properties data values map to: position, shape, size, color, line width, line type.",
"<b class=k>Variable types:</b> continuous/discrete (quantitative), unordered/ordered factors (qualitative), date/time, text.",
"<b class=k>The challenge:</b> balance scientific accuracy with visual appeal; good visualization strengthens the message and avoids distracting elements.",
"<b class=k>Two audiences:</b> scientists know the data but may lack visual sense; designers create attractive graphics but may distort the data. Aim to serve both.",
"<b class=k>Bar example (A=3, B=5, C=4):</b> (b) Ugly: correct but garish; (c) Bad: separate y-axis per bar; (d) Wrong: heights don’t match values.",
"<b class=k>Six common aesthetics:</b> position, shape, size, color, line width, line type. Some suit continuous data, others discrete data.",
"<b class=k>Six variable types:</b> continuous, discrete, unordered factors, ordered factors, date/time, text. 0.5, 1.0, 1.5 can be discrete if no in-between values exist.",
"<b class=k>Scales</b> map data values to aesthetics (e.g. temperature → y-axis, day → x-axis, location → line color). A plot can use many scales at once."],
p3:["<b class=k>Scatter plot</b> shows the relationship between two variables: positive, negative or none (random points).",
"<b class=k>Line of best fit</b> follows the overall trend; it need not pass through any point, and it is used for prediction.",
"<b class=k>Line graph</b> shows change over time. <b class=k>Histogram</b> has touching bars for continuous data; a bar chart has gaps between categories.",
"<b class=k>Stacked bar:</b> each bar is a whole with stacked parts (Simple or 100%). <b class=k>Range bar:</b> min and max only. <b class=k>Bullet:</b> feature measure versus target.",
"<b class=k>Box plot:</b> Q1, Q2 (median), Q3 and <b class=k>IQR = Q3 − Q1</b>. <b class=k>Pie</b> suits only 2–4 categories. <b class=k>Donut</b> is a pie with an empty center.",
"<b class=k>Tool shown:</b> Tableau, including interactive mashups (linked charts on one dashboard).",
"<b class=k>Correlation types:</b> positive (age and height), negative (age and time to run a distance), none (age and eye color). Points close to the line mean strong correlation.",
"<b class=k>Best-fit line and r:</b> the line follows the trend and predicts (tornadoes: 1,200 expected in 2015). r = 0 means independent; r &gt; 0 positive; r &lt; 0 negative; r ≈ 0.72 is fairly positive.",
"<b class=k>Line graph rules:</b> title, labeled axes, y usually starts at 0 with equal steps, flat line = no change. Fine for monthly rainfall, wrong for “who likes pizza”. <b class=k>Area</b> fills below the line; stacked area can’t show negatives.",
"<b class=k>Double bar</b> compares two related groups with a key. <b class=k>Histogram</b> starts from a frequency table with equal intervals. <b class=k>Stacked bar</b> has Simple and 100% types.",
"<b class=k>Range bar</b> (floating bar) shows min and max. <b class=k>Bullet graph:</b> feature measure (bar) versus comparative measure (target), with at most five qualitative ranges.",
"<b class=k>Box plot example:</b> Q2=79, Q1=69, Q3=87, IQR=18; outlier limits are Q1 − 1.5×IQR and Q3 + 1.5×IQR (42 and 114), so no outliers. It shows the middle and skew, not frequency.",
"<b class=k>Pie:</b> 2–4 categories, label slices directly, sort by value. <b class=k>Donut</b> is read by arc length. <b class=k>Annular</b> compares several groups. Angle = value ÷ total × 360 (Scissor: 4/9 × 360 = 160°)."]};

const stp=x=>x.replace(/<[^>]+>/g,"").trim();
function lines(x){const t=x.split(/(<[^>]+>)/),L=[];let cur="",open=0,pd=0;
for(const z of t){if(!z)continue;if(z[0]=="<"){if(z[1]=="/")open--;else if(!/^<br/.test(z))open++;cur+=z;
if(z[1]=="/"&&open==0){const v=stp(cur);if((/:$/.test(v)&&v.length<60)||(v.length<=10&&/❌|✅|✔|✓|✗|صح|خطأ/.test(v))){L.push(cur);cur=""}}continue}
let b="";for(let k=0;k<z.length;k++){const c=z[k];b+=c;if(c=="(")pd++;if(c==")")pd--;
if(".؛؟!".includes(c)&&pd<=0&&open==0&&k+1<z.length&&/\s/.test(z[k+1])){L.push(cur+b);cur="";b="";while(/\s/.test(z[k+1]||""))k++}}
cur+=b}
L.push(cur);return L.map(v=>v.trim()).filter(v=>stp(v))}

function item(p){const v=stp(p).replace(/\.$/,"");const m=v.match(/^(.{1,60}?)\s*=\s*(.+)$/)||v.match(/^(.{1,40}?)\s*\((.+)\)$/);return m?tm(m[1],m[2]):"<div class=ln>"+p+"</div>"}
function ln2(l){const v=stp(l);let m=l.match(/^<b class=c>([\s\S]*?)<\/b>\s*=\s*([\s\S]*)$/);if(m)return tm(stp(m[1]),m[2]);
m=v.match(/^(.{1,30}?):\s*([A-Za-z][^،:]*(?:,\s*[A-Za-z][^،:]*){2,})\.?$/);
if(m)return "<div class=\"ln hd\">"+m[1]+":</div><div class=chips>"+m[2].split(/,\s*/).map(c=>"<span class=chip>"+c.replace(/\.$/,"")+"</span>").join("")+"</div>";
return "<div class=\""+(/:$/.test(v)&&v.length<60?"ln hd":"ln")+"\">"+l+"</div>"}
function fmtM(e){let h="";e.split(/(<b class=k>[^<]{1,80}:<\/b>)/).filter(v=>stp(v)).forEach(z=>{

const ps=z.split(/\s•\s/);
if(ps.length>1)ps.forEach(p=>{const q=p.replace(/\.\s+/g,".\u0001").split("\u0001");h+=item(q[0]);q.slice(1).forEach(r=>{h+=lines(r).map(ln2).join("")})});
else h+=lines(z).map(ln2).join("")});return "<div class=pg>"+h+"</div>"}

const GLM={};GL.split('|').forEach(p=>{const i=p.indexOf(':');if(i>0)GLM[p.slice(0,i)]=p.slice(i+1)});
const TC={};
function stems(w){const o=[w];if(w.endsWith('ies'))o.push(w.slice(0,-3)+'y');if(w.endsWith('s'))o.push(w.slice(0,-1));if(w.endsWith('es'))o.push(w.slice(0,-2));if(w.endsWith('ed'))o.push(w.slice(0,-2),w.slice(0,-1));if(w.endsWith('ing'))o.push(w.slice(0,-3),w.slice(0,-3)+'e');return o}
async function trWord(w){const k=w.toLowerCase().replace(/[’']s$/,'');for(const s of stems(k))if(GLM[s])return GLM[s];if(TC[k])return TC[k];
try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(k)+'&langpair=en|ar');const j=await r.json();let t=(j.responseData&&j.responseData.translatedText)||'';if(!t||/MYMEMORY|QUERY LENGTH/i.test(t)||/[A-Za-z]{3,}/.test(t))t='';return TC[k]=t||null}catch(e){return null}}
const WRE=/[A-Za-z][A-Za-z’'\-]*[A-Za-z]|[A-Za-z]/g;
function wrapEl(el){if(el.dataset.wrapped)return;el.dataset.wrapped=1;
const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||p.closest('.wd,.nw,select,option,script,style'))return NodeFilter.FILTER_REJECT;const d=p.closest('[dir]');if(d&&d.getAttribute('dir')==='rtl')return NodeFilter.FILTER_REJECT;return /[A-Za-z]/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
const nodes=[];while(tw.nextNode())nodes.push(tw.currentNode);
nodes.forEach(n=>{const t=n.nodeValue,f=document.createDocumentFragment();let last=0;t.replace(WRE,(m,i)=>{if(i>last)f.append(t.slice(last,i));const s=document.createElement('span');s.className='wd';s.textContent=m;f.append(s);last=i+m.length;return m});if(last<t.length)f.append(t.slice(last));n.replaceWith(f)})}
function showAr(s){if(s.dataset.busy)return;s.dataset.busy=1;trWord(s.dataset.o||s.textContent).then(t=>{delete s.dataset.busy;if(!t){s.classList.add('nt');setTimeout(()=>s.classList.remove('nt'),700);return}if(!s.dataset.o){s.dataset.o=s.textContent}s.textContent=t;s.classList.add('tr')})}
function revert(s){if(s.dataset.o){s.textContent=s.dataset.o;delete s.dataset.o}s.classList.remove('tr')}
document.addEventListener('mouseover',e=>{const t=e.target;if(!t.closest)return;let s=t.closest('.wd');
if(!s){const c=t.closest('[dir=ltr]');if(c&&!c.closest('select'))wrapEl(c);return}
clearTimeout(s._rv);if(!s.classList.contains('tr')){clearTimeout(s._hv);s._hv=setTimeout(()=>showAr(s),1000)}});
document.addEventListener('mouseout',e=>{const s=e.target.closest&&e.target.closest('.wd');if(!s||s.contains(e.relatedTarget))return;clearTimeout(s._hv);if(s.classList.contains('tr')){clearTimeout(s._rv);s._rv=setTimeout(()=>revert(s),2000)}});
document.addEventListener('mousemove',e=>{const t=e.target;if(t.closest&&!t.closest('.wd')){const c=t.closest('[dir=ltr]');if(c&&!c.dataset.wrapped&&!c.closest('select'))wrapEl(c)}},{passive:true});
</script>
